name: CI

on:
  pull_request:
    branches: main

jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

      - name: Actionlint
        uses: reviewdog/action-actionlint@23bcc6aa6e2ccffe1e7730111b98ddcaf34cb098  # v1.76.3
        with:
          fail_level: error

      - name: Yamllint
        uses: reviewdog/action-yamllint@290d92c84b22627946efc7fd6f038ade2d2beede  # v1.25.0
        with:
          fail_level: error
